name: Public repository checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-public-repo:
    name: validate-public-repo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CI validator dependency
        run: python -m pip install -r requirements-ci.txt
      - name: Validate public repository
        run: python scripts/validate_public_repo.py
      - name: Verify exact subject binding
        run: python scripts/test_exact_subject.py
      - name: Verify exact-bound REM extraction
        run: python scripts/test_rem_extract_exact.py
      - name: Verify REM v1.1 schema and evidence gate
        run: python scripts/test_validate_rem_v11.py
      - name: Verify legacy REM extractor
        run: python scripts/test_rem_extract.py
      - name: Verify Wave A assurance extraction
        run: python scripts/test_v2_wave_a.py
      - name: Verify Wave B resilience extraction
        run: python scripts/test_v2_wave_b.py
      - name: Verify Wave C model cost config concurrency extraction
        run: python scripts/test_v2_wave_c.py
      - name: Verify Wave D migration interface license extraction
        run: python scripts/test_v2_wave_d.py
      - name: Verify Overall Repository Portrait
        run: python scripts/test_audit_portrait.py
      - name: Verify v2 assurance completion contract
        run: python scripts/test_v2_assurance_summary.py
      - name: Verify integrated Audit v2 portrait
        run: python scripts/test_audit_v2.py
